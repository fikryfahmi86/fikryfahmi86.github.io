<!DOCTYPE html>

<style>

*{

padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:30px;
overflow-x:hidden;

background:
radial-gradient(circle at top right,#1d4ed8 0%,transparent 25%),

linear-gradient(135deg,#010816,#020b22,#010816);

body::before{

font-weight:900;
color:rgba(255,255,255,0.03);

pointer-events:none;
}

body::after{
content:"FF";
position:fixed;
right:20px;
bottom:60px;

font-weight:900;
color:rgba(255,255,255,0.03);

}

.card{
width:100%;
max-width:1100px;

padding:70px 50px;

background:rgba(3,15,45,.78);

backdrop-filter:blur(18px);

border:1px solid rgba(96,165,250,.45);

border-radius:30px;

box-shadow:
0 0 30px rgba(59,130,246,.25),
0 0 120px rgba(59,130,246,.10);

text-align:center;
}

.logo{
margin-bottom:25px;
}

.logo img{
width:220px;
max-width:100%;
display:block;
margin:auto;
}

.name{
font-size:clamp(2rem,4vw,4rem);
font-weight:800;
letter-spacing:6px;
text-transform:uppercase;
margin-bottom:15px;
text-shadow:0 0 15px rgba(255,255,255,.08);
}

.tagline{
font-size:1rem;
letter-spacing:5px;
text-transform:uppercase;
color:#cbd5e1;
margin-bottom:25px;
}

.divider{
width:180px;
height:3px;
margin:auto;
border-radius:20px;

background:
linear-gradient(
90deg,
transparent,
#38bdf8,
transparent
);

box-shadow:0 0 15px #38bdf8;

margin-bottom:35px;
}

.desc{
font-size:1.15rem;
line-height:1.8;
color:#dbeafe;
margin-bottom:40px;
}

.buttons{
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
}

.btn{
min-width:280px;
padding:22px;

text-decoration:none;

font-size:1.4rem;
font-weight:700;

border-radius:16px;

transition:.25s;
}

.btn:hover{
transform:translateY(-4px);
}

.email{
background:
linear-gradient(
135deg,
#1d4ed8,
#2563eb
);

color:white;

border:1px solid rgba(96,165,250,.6);

box-shadow:
0 0 20px rgba(59,130,246,.35);
}

.whatsapp{
background:
linear-gradient(
135deg,
#16a34a,
#22c55e
);

color:white;

border:1px solid rgba(74,222,128,.6);

box-shadow:
0 0 20px rgba(34,197,94,.35);
}

.footer{
margin-top:40px;

font-size:.95rem;

letter-spacing:4px;

color:#cbd5e1;

text-align:center;
}

@media(max-width:768px){

.card{
padding:40px 20px;
}

.logo img{
width:160px;
}

.name{
font-size:1.5rem;
letter-spacing:2px;
}

.tagline{
font-size:.75rem;
letter-spacing:2px;
}

.desc{
font-size:1rem;
}

.btn{
width:100%;
min-width:unset;
font-size:1.1rem;
}

.footer{
font-size:.75rem;
letter-spacing:2px;
}

}

</style>

<div class="card">

FINANCE • CAPITAL • INVESTMENT

<div class="divider"></div>

<div class="buttons">

</a>

<a href="https://wa.me/60199664339" target="_blank" class="btn whatsapp">
📱 WhatsApp

</div>

<div class="footer">
